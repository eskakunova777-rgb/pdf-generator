<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'DejaVu Sans';
        src: local('DejaVu Sans');
    }
    body {
        font-family: 'DejaVu Sans', 'Roboto', 'Liberation Sans', sans-serif;
        color: #222;
        margin: 40px;
    }
    h1 {
        font-size: 22px;
        border-bottom: 2px solid #222;
        padding-bottom: 10px;
    }
    .meta {
        margin: 20px 0;
        font-size: 13px;
    }
    .meta div {
        margin-bottom: 4px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        table-layout: fixed;
    }
    th, td {
        border: 1px solid #999;
        padding: 8px 10px;
        text-align: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
    th {
        background: #f0f0f0;
    }
    td.product {
        text-align: left;
    }
    .total {
        margin-top: 20px;
        text-align: right;
        font-size: 15px;
        font-weight: bold;
    }
    .footer {
        margin-top: 40px;
        font-size: 11px;
        color: #777;
    }
</style>
</head>
<body>
    <h1>Чек №{{ invoice_id }}</h1>
    <div class="meta">
        <div>Клиент: {{ customer_name }}</div>
        <div>Дата: {{ date }}</div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 50%;">Наименование</th>
                <th style="width: 15%;">Кол-во</th>
                <th style="width: 15%;">Цена, ₽</th>
                <th style="width: 20%;">Сумма, ₽</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="product">{{ product }}</td>
                <td>{{ qty }}</td>
                <td>{{ price }}</td>
                <td>{{ total }}</td>
            </tr>
        </tbody>
    </table>
    <div class="total">Итого: {{ total }} ₽</div>
    <div class="footer">Документ сгенерирован автоматически.</div>
</body>
</html>
